      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 1rem;

      margin-bottom: 1.25rem;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;

    .tab-btn.active { background: var(--primary); color: #0f172a; border-color: var(--primary); }

    .mode-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    select, .action-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;

    .action-btn:hover { border-color: var(--primary); }

      gap: 0.75rem;
      margin-bottom: 1.5rem;

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      text-align: center;
    }

    .badge-warn { color: var(--warning); }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35rem;
      margin-bottom: 1.15rem;

      margin-bottom: 0.65rem;
      font-size: 0.82rem;
      color: var(--primary);
      font-weight: 600;

      color: #0f172a;

      margin: 0.85rem 0 1.1rem;

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      text-align: left;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);

      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s ease;

    .option-btn.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); }
    .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: #bbf7d0; }

    .option-letter { font-weight: 700; color: var(--primary); min-width: 22px; }

    .explanation {
      margin-top: 0.9rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.7);
      border-left: 3px solid var(--primary);
      font-size: 0.9rem;
      color: #cbd5e1;
      display: none;
    }
    .explanation.visible { display: block; }
    .explanation strong { color: var(--text); }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

</head>

    const QUESTIONS = [
      // CHAPTER 9: ALTERNATING CURRENT BASICS (1-20)
      { ch: 9, num: 1, q: "In a perfect AC sine wave with no DC component, the peak-to-peak voltage equals", options: ["half the positive peak voltage.", "the positive peak voltage.", "twice the positive peak voltage.", "four times the positive peak voltage."], ans: 2, exp: "With no DC offset, positive and negative peaks have equal magnitudes, so V_pk-pk = 2 × V_pk+." },
      { ch: 9, num: 2, q: "In a perfect AC sine wave with no DC component, π/2 radians of phase represents", options: ["1/6 of a full cycle.", "1/4 of a full cycle.", "1/3 of a full cycle.", "2/3 of a full cycle."], ans: 1, exp: "A full cycle is 2π radians (360°). Dividing π/2 by 2π gives 1/4 of a full cycle (90°)." },
      { ch: 9, num: 3, q: "A rectangular wave has", options: ["an instantaneous rise time and a defined, finite decay time.", "a defined, finite rise time and an instantaneous decay time.", "a defined, finite rise time and an equal finite decay time.", "an instantaneous rise time and an instantaneous decay time."], ans: 3, exp: "An ideal rectangular wave jumps instantaneously between its two amplitude levels on both rising and falling edges." },
      { ch: 9, num: 4, q: "An engineer says that an AC sine wave has a frequency of 100 Hz. A physicist might say that the angular frequency is", options: ["50π rad/s", "100π rad/s", "200π rad/s", "100π² rad/s"], ans: 2, exp: "Angular frequency ω = 2πf = 2π(100 Hz) = 200π rad/s." },
      { ch: 9, num: 5, fig: "9-15", q: "Figure 9-15 shows an AC wave as it might appear on an oscilloscope screen. Each vertical division represents 100 mV. Each horizontal division represents 100 µs. What's the frequency of this wave?", options: ["2.00 kHz", "5.00 kHz", "10.0 kHz", "The graph lacks enough information to say."], ans: 1, exp: "One full cycle spans 2 horizontal divisions = 200 µs = 0.0002 s. Frequency f = 1 / 0.0002 s = 5,000 Hz = 5.00 kHz." },
      { ch: 9, num: 6, fig: "9-15", q: "What's the negative peak voltage of the wave shown in Fig. 9-15, based on the appearance of the graph? Positive voltages go upward on the vertical scale, while negative voltages go downward.", options: ["−250 mV pk−", "−500 mV pk−", "−750 mV pk−", "The graph lacks enough information to say."], ans: 0, exp: "The negative peak extends 2.5 divisions below the horizontal time axis. At 100 mV/div, 2.5 × (−100 mV) = −250 mV pk−." },
      { ch: 9, num: 7, fig: "9-16", q: "Figure 9-16 shows another wave. Each vertical division represents 100 mV, and each horizontal division represents 100 µs. What's the period?", options: ["100 µs", "200 µs", "400 µs", "The graph lacks enough information to say."], ans: 2, exp: "One full triangular cycle spans 4 horizontal divisions. At 100 µs/div, T = 4 × 100 µs = 400 µs." },
      { ch: 9, num: 8, fig: "9-16", q: "What's the peak-to-peak voltage of the wave shown in Fig. 9-16? Each vertical division represents 100 mV and each horizontal division represents 100 µs.", options: ["100 mV pk-pk", "200 mV pk-pk", "400 mV pk-pk", "The graph lacks enough information to say."], ans: 2, exp: "The wave swings from +2 divisions (+200 mV) to −2 divisions (−200 mV), giving 400 mV pk-pk." },

      { ch: 9, num: 11, fig: "9-17", q: "What's the positive peak voltage of the wave shown in Fig. 9-17? Positive voltages go upward on the vertical scale, while negative voltages go downward.", options: ["+240 mV pk+", "+120 mV pk+", "+480 mV pk+", "The graph lacks enough information to say."], ans: 0, exp: "The highest positive peak reaches 2.4 divisions above the axis: 2.4 × 100 mV = +240 mV pk+." },

      { ch: 9, num: 15, q: "Two sine waves have the same frequency, with DC components of +10 V each. The waves coincide in phase. One wave measures +21 V pk+ including its +10 V DC component, while the other wave measures +17 V pk+ including its +10 V DC component. What's the positive peak voltage of the composite wave?", options: ["+58 V pk+", "+48 V pk+", "+38 V pk+", "We need more information to say."], ans: 2, exp: "Since the waves are in phase coincidence and already include their +10 V DC offsets, their positive peaks add directly: 21 V + 17 V = +38 V pk+." },
      { ch: 9, num: 16, q: "Two sine waves have the same frequency but differ in phase by 180°. Neither wave has a DC component. One wave measures +21 V pk+, while the other wave measures +17 V pk+. What's the positive peak voltage of the composite wave?", options: ["+38 V pk+", "+19 V pk+", "+8 V pk+", "+4 V pk+"], ans: 3, exp: "180° out-of-phase sine waves subtract directly: 21 V − 17 V = +4 V pk+." },
      { ch: 9, num: 17, q: "Two AC waves have the same frequency but differ in phase by 1/6 of a cycle. What's this phase difference expressed in degrees?", options: ["120°", "90°", "60°", "45°"], ans: 2, exp: "1/6 × 360° = 60°." },
      { ch: 9, num: 18, q: "The frequency of an AC wave in megahertz (MHz) equals", options: ["1,000,000 times the reciprocal of its period in seconds.", "1000 times the reciprocal of its period in seconds.", "0.001 times the reciprocal of its period in seconds.", "0.000001 times the reciprocal of its period in seconds."], ans: 3, exp: "1/T gives frequency in Hz; multiplying by 10⁻⁶ (0.000001) converts Hz to MHz." },
      { ch: 9, num: 19, q: "The 7th harmonic of an AC wave with a period of 10.0 microseconds (µs) has a frequency of", options: ["7.00 MHz.", "3.50 MHz.", "700 kHz.", "350 kHz."], ans: 2, exp: "Fundamental frequency f = 1 / (10 × 10⁻⁶ s) = 100 kHz. The 7th harmonic is 7 × 100 kHz = 700 kHz." },
      { ch: 9, num: 20, q: "If you connect a 126-V DC battery in series with the output of a 120-V RMS (not positive peak or negative peak) sine-wave AC wall outlet, you'll get", options: ["pure DC.", "AC with equal positive and negative peak voltages.", "AC with different positive and negative peak voltages.", "fluctuating DC."], ans: 2, exp: "120 V RMS has peak amplitude 120 × √2 ≈ ±170 V. Adding +126 V DC shifts the peaks to +296 V and −44 V—still AC (reverses polarity) but with unequal peaks." },

      // CHAPTER 10: INDUCTANCE (1-20)
      { ch: 10, num: 1, q: "Which of the following statements represents an advantage of a toroidal coil over a solenoidal coil?", options: ["You can easily permeability-tune a toroid but not a solenoid.", "A toroid can carry more current than a solenoid with the same gauge wire.", "A toroid can function with a ferromagnetic core, but a solenoid cannot.", "A toroid practically prevents unwanted mutual inductance, while solenoids allow it."], ans: 3, exp: "A closed toroidal core confines almost all magnetic flux inside the core, preventing stray coupling to nearby components." },
      { ch: 10, num: 2, q: "You connect four 44.0-mH toroidal inductors in parallel. They exhibit no mutual inductance. What's the net inductance of the combination?", options: ["11.0 mH", "22.0 mH", "88.0 mH", "176 mH"], ans: 0, exp: "Equal inductors in parallel without mutual inductance divide by n: 44.0 mH / 4 = 11.0 mH." },
      { ch: 10, num: 3, q: "You connect two 44.0-mH solenoidal inductors in series. They exhibit no mutual inductance. What's the net inductance of the combination?", options: ["22.0 mH", "88.0 mH", "176 mH", "352 mH"], ans: 1, exp: "Inductors in series without mutual inductance add directly: 44.0 mH + 44.0 mH = 88.0 mH." },
      { ch: 10, num: 4, fig: "10-12", q: "In Fig. 10-12, both inductors have values of 40 mH. Their magnetic fields oppose each other. Some mutual inductance exists between them. The net inductance of the combination is", options: ["less than 80 mH.", "exactly 80 mH.", "more than 80 mH.", "zero."], ans: 0, exp: "In series-opposing connection, L_net = L1 + L2 − 2M = 80 mH − 2M, which is less than 80 mH." },
      { ch: 10, num: 5, fig: "10-13", q: "In Fig. 10-13, both inductors have values of 40 µH. Their magnetic fields reinforce each other. Some mutual inductance exists between them. The net inductance of the combination is", options: ["less than 80 µH.", "exactly 80 µH.", "more than 80 µH.", "160 µH."], ans: 2, exp: "In series-aiding connection, L_net = L1 + L2 + 2M = 80 µH + 2M, which is greater than 80 µH." },
      { ch: 10, num: 6, q: "To obtain the lowest possible inductance for a 100-turn coil, you should use", options: ["an air-core solenoid.", "a powdered-iron-core solenoid.", "a pot-core coil.", "a powdered-iron-core toroid."], ans: 0, exp: "Air has the lowest relative permeability (μ_r ≈ 1), yielding much lower inductance than ferromagnetic cores." },
      { ch: 10, num: 7, q: "Which of the following factors affects the inductance of a pot-core coil, if all other factors stay the same?", options: ["The frequency of the applied signal", "The amplitude of the applied signal", "The wave shape of the applied signal", "The permeability of the core (shell) material"], ans: 3, exp: "Inductance is a physical property determined by coil geometry, turns, and core permeability—not signal frequency, amplitude, or waveform." },
      { ch: 10, num: 8, q: "As you increase the number of turns increases in an air-core coil, then its inductance, assuming all other factors remain constant,", options: ["increases.", "stays the same.", "decreases.", "approaches zero."], ans: 0, exp: "Inductance scales with the square of the number of turns (L ∝ N²), so increasing turns increases inductance." },
      { ch: 10, num: 9, q: "As you increase the amplitude of the AC signal that you apply to a toroidal coil, leaving all other factors unchanged, the coil's inductance", options: ["increases.", "stays the same.", "decreases.", "approaches zero."], ans: 1, exp: "Below core saturation, inductance is independent of applied AC signal amplitude." },
      { ch: 10, num: 10, q: "To increase the inductance of a solenoidal coil without changing anything else, you can increase the", options: ["signal frequency.", "core permeability.", "signal strength.", "wire diameter."], ans: 1, exp: "Inserting a higher-permeability core concentrates magnetic flux and increases inductance." },
      { ch: 10, num: 11, q: "You connect a 500-µH inductor coil in series with a 900-µH inductor coil, winding them over each other so the coefficient of coupling is 1. Both coils are solenoids whose magnetic fields reinforce each other. What's the mutual inductance between the coils?", options: ["1.40 mH", "700 µH", "671 µH", "More information is needed to calculate it."], ans: 2, exp: "M = k√(L1·L2) = 1 × √(500 × 900) = √450,000 ≈ 671 µH." },
      { ch: 10, num: 12, q: "What's the net (total) inductance of the above combination?", options: ["2.74 mH", "2.04 mH", "2.01 mH", "More information is needed to calculate it."], ans: 0, exp: "L_total = L1 + L2 + 2M = 500 µH + 900 µH + 2(671 µH) = 2,742 µH ≈ 2.74 mH." },
      { ch: 10, num: 13, q: "At which of the following frequencies would you most likely use an air-core solenoidal coil to obtain useful inductance?", options: ["6 kHz", "20 MHz", "900 GHz", "Any of the above"], ans: 1, exp: "Air-core coils have small inductance values ideal for VHF/HF radio frequencies like 20 MHz (whereas 6 kHz needs large cores and 900 GHz uses waveguides/cavities)." },
      { ch: 10, num: 14, q: "You have two 50-turn, air-core, loop-like coils, each one measuring 2 centimeters in diameter. You align their axes, place them far from one another, and then gradually bring them closer together. What happens to the coefficient of coupling as you do this?", options: ["It decreases.", "It stays the same.", "It increases.", "You'll need more information to answer this question."], ans: 2, exp: "As unshielded coils move closer together, a larger fraction of magnetic flux links both coils, increasing k." },
      { ch: 10, num: 15, q: "What happens to the mutual inductance between the two coils as you carry out the exercise described in Question 14 above?", options: ["It decreases.", "It stays the same.", "It increases.", "You'll need more information to answer this question."], ans: 3, exp: "In the textbook answer key, without knowing exact coil dimensions/inductance values (L1 and L2), exact M = k√(L1·L2) cannot be quantified." },
      { ch: 10, num: 16, q: "You have two 50-turn loop-like coils, each one measuring 2 centimeters in diameter. You surround each coil with a pot-core shell, align their axes, place them far from one another, and then gradually bring them closer together. What happens to the coefficient of coupling as you do this?", options: ["It decreases.", "It stays the same.", "It increases.", "You'll need more information to answer this question."], ans: 1, exp: "Pot cores completely enclose the magnetic field inside the ferrite shell, keeping external coupling k effectively zero regardless of distance." },
      { ch: 10, num: 17, q: "What happens to the mutual inductance between the two coils as you carry out the exercise described in Question 16 above?", options: ["It decreases.", "It stays the same.", "It increases.", "You'll need more information to answer this question."], ans: 1, exp: "Because k remains zero due to the self-shielding pot cores, mutual inductance M stays constant (at zero)." },
      { ch: 10, num: 18, q: "Consider a length of transmission line with its wires connected together at the far end. Suppose that the line's velocity factor is 0.750, and you apply a signal at 100 MHz to the open (near) end. To make this line measure 1/4 electrical wavelength, you must cut it to a physical length of", options: ["1.13 m.", "79.5 cm.", "56.3 cm.", "23.1 cm."], ans: 2, exp: "Free-space λ = 300 / 100 MHz = 3.00 m. Quarter-wave in free space = 0.75 m. With velocity factor 0.750: 0.75 m × 0.750 = 0.5625 m = 56.3 cm." },
      { ch: 10, num: 19, q: "If you decrease the frequency to 90 MHz in the situation described in Question 18 above but don't change anything else, and if you keep the wires at the line's far end connected together, then the signal source at the open (near) end will "see"", options: ["a capacitance.", "a short circuit.", "an inductance.", "an open circuit."], ans: 2, exp: "At 90 MHz, the fixed physical line is shorter than 1/4 electrical wavelength; a shorted stub < λ/4 behaves inductively." },
      { ch: 10, num: 20, q: "If you increase the frequency to 230 MHz in the situation described in Question 18 but don't change anything else, and if you keep the wires at the line's far end connected together, then the signal source at the open (near) end will "see"", options: ["a capacitance.", "a short circuit.", "an inductance.", "an open circuit."], ans: 2, exp: "At 230 MHz, the line is just over 1/2 wavelength (200 MHz = λ/2); between λ/2 and 3λ/4, a shorted stub again behaves as an inductance." },

      // CHAPTER 11: CAPACITANCE (1-20)
      { ch: 11, num: 1, q: "If the value (capacitance) of a capacitor remains constant when the temperature changes within a reasonable range, then its temperature coefficient is", options: ["zero.", "unity.", "infinite.", "undefined."], ans: 0, exp: "A zero temperature coefficient (NP0/C0G) means capacitance does not drift with temperature." },
      { ch: 11, num: 2, q: "You can increase the value of a mica-dielectric capacitor, assuming all other factors remain constant, by replacing the mica with", options: ["strontium titanate.", "polyethylene.", "paper.", "air."], ans: 0, exp: "Strontium titanate has an exceptionally high dielectric constant (hundreds to thousands), far exceeding mica (~5–7)." },
      { ch: 11, num: 3, q: "Fill in the blank to make the following sentence true: "As you reduce the value of a capacitor, it ______ to completely charge after you connect a 6-V battery to its plates, assuming all other factors remain constant."", options: ["takes more time", "becomes more difficult", "takes less time", "takes more energy"], ans: 2, exp: "Charging time constant τ = R × C; smaller capacitance C means less charge Q = C·V is needed, so it charges faster." },
      { ch: 11, num: 4, q: "Which of the following values would you most likely find in an air-variable capacitor?", options: ["1000 µF", "68 pF", "3.3 µF", "50,000 pF"], ans: 1, exp: "Air-variable tuning capacitors typically range from a few picofarads up to several hundred picofarads (such as 68 pF)." },
      { ch: 11, num: 5, q: "Which of the following values would you least likely find in a single-layer disk-ceramic capacitor?", options: ["150 pF", "680 pF", "0.01 µF", "330 µF"], ans: 3, exp: "330 µF is far too large for a single-layer disk ceramic and is typically an electrolytic capacitor value." },
      { ch: 11, num: 6, q: "A capacitance of 0.01 nanofarad is the same as a capacitance of", options: ["0.1 pF.", "1 pF.", "10 pF.", "100 pF."], ans: 2, exp: "1 nF = 1,000 pF, so 0.01 nF = 0.01 × 1,000 pF = 10 pF." },
      { ch: 11, num: 7, q: "If you connect four 100-pF capacitors in series, you get a net capacitance of", options: ["25 pF.", "50 pF.", "100 pF.", "400 pF."], ans: 0, exp: "Equal capacitors in series divide by n: 100 pF / 4 = 25 pF." },
      { ch: 11, num: 8, q: "If you connect four 100-pF capacitors in parallel, you get a net capacitance of", options: ["25 pF.", "50 pF.", "100 pF.", "400 pF."], ans: 3, exp: "Capacitors in parallel add directly: 4 × 100 pF = 400 pF." },
      { ch: 11, num: 9, q: "If you connect four 100-pF capacitors in a 2 × 2 series-parallel matrix, you get a net capacitance of", options: ["25 pF.", "50 pF.", "100 pF.", "400 pF."], ans: 2, exp: "Any symmetric N × N matrix of identical capacitors C yields a net capacitance equal to C (100 pF)." },
      { ch: 11, num: 10, q: "If you connect nine 100-pF capacitors in a 3 × 3 series-parallel matrix, you get a net capacitance of", options: ["25 pF.", "50 pF.", "100 pF.", "400 pF."], ans: 2, exp: "Each 3-capacitor series branch is 100/3 pF; three such branches in parallel give 3 × (100/3) = 100 pF." },
      { ch: 11, num: 11, q: "The main advantage of air as a dielectric material for capacitors is the fact that air", options: ["allows for a lot of capacitance in a small volume.", "exhibits low loss.", "works well at low voltages.", "has a high dielectric constant."], ans: 1, exp: "Dry air has negligible dielectric loss at radio frequencies, giving air capacitors very high Q." },
      { ch: 11, num: 12, q: "A capacitance of 6800 nF is the same as", options: ["0.06800 µF.", "0.6800 µF.", "6.800 µF.", "68.00 µF."], ans: 2, exp: "1,000 nF = 1 µF, so 6,800 nF = 6.800 µF." },
      { ch: 11, num: 13, q: "Which of the following properties is characteristic of tantalum capacitors?", options: ["High reliability", "High capacitance per unit of volume", "High efficiency", "All of the above"], ans: 3, exp: "Tantalum capacitors offer high volumetric efficiency, low leakage, and strong long-term reliability." },
      { ch: 11, num: 14, q: "Which of the following values would you most expect to find in an electrolytic capacitor?", options: ["0.100 pF", "100 pF", "0.100 µF", "100 µF"], ans: 3, exp: "Electrolytic capacitors are built for large capacitances from roughly 1 µF up to thousands of microfarads (like 100 µF)." },
      { ch: 11, num: 15, q: "You connect a 10-pF capacitor in parallel with a 20-pF capacitor. What's the net capacitance?", options: ["30 pF", "15 pF", "6.7 pF", "5.5 pF"], ans: 0, exp: "Parallel capacitances add: 10 pF + 20 pF = 30 pF." },
      { ch: 11, num: 16, q: "You connect a 10-pF capacitor in series with a 20-pF capacitor. What's the net capacitance?", options: ["30 pF", "15 pF", "6.7 pF", "5.5 pF"], ans: 2, exp: "C_net = (10 × 20) / (10 + 20) = 200 / 30 ≈ 6.7 pF." },
      { ch: 11, num: 17, q: "You find a capacitor rated at 220 pF ±10%. Which of the following capacitance values lies outside the acceptable range?", options: ["180 pF", "195 pF", "246 pF", "All of the above"], ans: 3, exp: "10% of 220 pF is 22 pF, so the acceptable range is 198 pF to 242 pF. All three values (180, 195, and 246 pF) fall outside." },
      { ch: 11, num: 18, q: "A capacitor, rated at 330 pF, shows an actual value of 340 pF. By how much does its actual capacitance differ from its rated capacitance?", options: ["+2.94%", "+3.03%", "−2.94%", "−3.03%"], ans: 1, exp: "Percentage error = ((340 − 330) / 330) × 100% = +10 / 330 ≈ +3.03%." },
      { ch: 11, num: 19, q: "Which of the following values would you most expect to see in a paper capacitor?", options: ["0.001 nF", "1.00 pF", "0.01 µF", "100 µF"], ans: 2, exp: "Paper/film capacitors commonly have values in the nanofarad to sub-microfarad range, such as 0.01 µF." },
      { ch: 11, num: 20, q: "If the number of plates in an air-variable capacitor decreases while all other factors remain constant,", options: ["the capacitance goes up.", "the capacitance goes down.", "the capacitance stays the same.", "You'll need more information to answer this question."], ans: 1, exp: "Fewer overlapping plates reduce effective plate area A, decreasing capacitance (C ∝ A)." },

      // CHAPTER 12: PHASE (1-20)
      { ch: 12, num: 1, q: "A sine wave has a frequency of 50 kHz. Therefore, a complete cycle takes", options: ["0.20 microseconds (µs). (Note: 1 µs = 0.000001 second.)", "2.0 µs.", "20 µs.", "200 µs."], ans: 2, exp: "T = 1 / f = 1 / 50,000 Hz = 0.00002 s = 20 µs." },
      { ch: 12, num: 2, q: "Which of the following statements is not characteristic of a pure sine wave with a well-defined and constant period?", options: ["The electrical energy is distributed over a wide range (band) of frequencies.", "The wave can be represented as a vector that rotates at a constant angular speed.", "The wave has a well-defined, constant wavelength as long as the medium that carries it doesn't change.", "The wave has a well-defined, constant frequency."], ans: 0, exp: "A pure sine wave concentrates all its energy at a single frequency, not across a wide band." },
      { ch: 12, num: 3, q: "If someone says that two sine waves differ in phase by an amount that constantly changes, then we know that the waves have", options: ["different periods.", "different wavelengths.", "different frequencies.", "All of the above"], ans: 3, exp: "A continuously changing phase difference means one wave is cycling faster than the other—so they have different frequencies, periods, and wavelengths." },
      { ch: 12, num: 4, q: "If wave X leads wave Y by 1/3 of a cycle, then", options: ["Y lags 120° behind X.", "Y lags 90° behind X.", "Y lags 60° behind X.", "Y lags 30° behind X."], ans: 0, exp: "1/3 of a 360° cycle is 120°. If X leads Y by 120°, then Y lags 120° behind X." },
      { ch: 12, num: 5, q: "Fill in the blank to make the following statement true: "Suppose that two pure sine waves having identical frequencies and no DC components, coincide in phase. If you change the phase of one wave by ______, you'll get two waves in phase opposition."", options: ["90°", "180°", "270°", "360°"], ans: 1, exp: "Shifting one of two coincident sine waves by 180° (half a cycle) places them in phase opposition." },
      { ch: 12, num: 6, q: "We can change the phase of a pure sine wave having a constant frequency and no DC component by one of the following four phase angles, and end up with, in effect, the same wave. Which angle?", options: ["45°", "90°", "180°", "360°"], ans: 3, exp: "A 360° shift equals one full cycle, returning the wave to its exact original state." },
      { ch: 12, num: 7, q: "A phase difference of 22.5° in the circular-motion model of a sine wave represents", options: ["1/16 of a revolution.", "1/8 of a revolution.", "1/4 of a revolution.", "1/2 of a revolution."], ans: 0, exp: "22.5° / 360° = 1/16 of a full revolution." },
      { ch: 12, num: 8, q: "Two perfect sine waves exist in phase opposition. One wave has voltage peaks of +7 V pk+ and −7 V pk−, and the other wave has voltage peaks of +3 V pk+ and −3 V pk−. What's the peak-to-peak voltage of the composite wave?", options: ["4 V pk-pk", "6 V pk-pk", "8 V pk-pk", "12 V pk-pk"], ans: 2, exp: "In phase opposition, the composite wave has peaks of +(7 − 3) = +4 V and −4 V, so V_pk-pk = 8 V pk-pk." },
      { ch: 12, num: 9, q: "A sine wave has a frequency of 60 Hz. How long does it take for 90° of phase to occur? (Note: 1 ms = 0.001 second.)", options: ["2.1 ms", "4.2 ms", "8.3 ms", "We need more information to calculate it."], ans: 1, exp: "Full period T = 1/60 s ≈ 16.67 ms. 90° is 1/4 cycle: 16.67 ms / 4 ≈ 4.17 ms ≈ 4.2 ms." },
      { ch: 12, num: 10, q: "In effect, a cosine wave is a sine wave shifted by", options: ["60°.", "90°.", "120°.", "180°."], ans: 1, exp: "cos(θ) = sin(θ + 90°), so a cosine wave is a sine wave shifted by 90° (1/4 cycle)." },
      { ch: 12, num: 11, q: "Two sine waves have the same frequency but differ in phase by 60°. Neither wave has a DC component. The two waves are offset by", options: ["1/6 of a cycle.", "1/4 of a cycle.", "1/3 of a cycle.", "1/2 of a cycle."], ans: 0, exp: "60° / 360° = 1/6 of a cycle." },
      { ch: 12, num: 12, q: "Technically, the term phase opposition refers to two waves (whether sine or not) having the same frequency and", options: ["inverted with respect to each other.", "displaced in phase by 90°.", "displaced in phase by 180°.", "displaced in phase by 270°."], ans: 0, exp: "For general (non-sinusoidal) waves, phase opposition means inverted polarity relative to each other (which equals 180° only for symmetric waves)." },
      { ch: 12, num: 13, q: "In a polar-coordinate vector diagram in which the radius represents voltage, the length of the rotating vector for a pure sine wave containing no DC component represents", options: ["half the peak voltage (positive or negative).", "the peak voltage (positive or negative).", "twice the peak voltage (positive or negative).", "the peak-to-peak voltage."], ans: 1, exp: "In standard polar vector plots of sine waves, the vector radius equals the peak amplitude V_pk." },
      { ch: 12, num: 14, q: "A sine wave X lags another sine wave Y by 45° of phase, so Y is", options: ["1/12 of a cycle ahead of X.", "1/10 of a cycle ahead of X.", "1/8 of a cycle ahead of X.", "1/6 of a cycle ahead of X."], ans: 2, exp: "45° / 360° = 1/8 of a cycle; if X lags Y, then Y is 1/8 cycle ahead of X." },
      { ch: 12, num: 15, fig: "12-12", q: "Figure 12-12 shows two sine waves X and Y that have the same frequency as a pair of polar vectors X and Y. Neither wave has a DC component. Which of the following statements holds true on the basis of this graph?", options: ["wave X lags wave Y by 1/6 of a cycle.", "wave X lags wave Y by 1/3 of a cycle.", "wave X leads wave Y by 1/6 of a cycle.", "wave X leads wave Y by 1/3 of a cycle."], ans: 1, exp: "Vectors rotate counterclockwise: Y is at 0° and X is at 240° (120° behind Y), so X lags Y by 120° = 1/3 of a cycle." },
      { ch: 12, num: 16, fig: "12-12", q: "Which, if any, of the following conclusions can we make about the relative peak-to-peak amplitudes of the two waves shown in Fig. 12-12?", options: ["The two waves have the same peak-to-peak amplitude.", "The peak-to-peak amplitude of wave X exceeds the peak-to-peak amplitude of wave Y.", "The peak-to-peak amplitude of wave Y exceeds the peak-to-peak amplitude of wave X.", "We can't say anything definitive about the relative peak-to-peak amplitudes of the two waves."], ans: 0, exp: "Both vector arrows X and Y extend to the exact same radial ring, meaning their peak and peak-to-peak amplitudes are equal." },
      { ch: 12, num: 17, fig: "12-13", q: "Figure 12-13 illustrates two sine waves, neither of which has a DC component, that are in phase", options: ["coincidence.", "opposition.", "quadrature.", "reinforcement."], ans: 2, exp: "The two waves are offset by 1/4 cycle (90°), which is defined as phase quadrature." },
      { ch: 12, num: 18, fig: "12-13", q: "If we invert one of the waves in Fig. 12-13, then the two waves will be in phase", options: ["coincidence.", "opposition.", "quadrature.", "reinforcement."], ans: 2, exp: "Inverting a wave shifts it by 180°; shifting a 90° difference by 180° produces a 270° (or −90°) difference—still phase quadrature!" },
      { ch: 12, num: 19, q: "Two AC waves (not necessarily sine waves) having the same frequency and both with 10-V peak-to-peak amplitude are in phase opposition. Neither wave has a DC component. What's the peak-to-peak voltage of the composite wave?", options: ["7.071 V pk-pk", "14.14 V pk-pk", "0 V pk-pk", "We need more information to know."], ans: 2, exp: "Because phase opposition means the waves are exact inversions of each other with equal amplitude, they cancel completely to 0 V pk-pk." },
      { ch: 12, num: 20, q: "Imagine that the two waves from the previous question differ in phase by 180°. What's the peak-to-peak voltage of the composite wave? Remember that the waves don't have to be sinusoids; they can have any imaginable form.", options: ["7.071 V pk-pk", "14.14 V pk-pk", "0 V pk-pk", "We need more information to know."], ans: 3, exp: "For non-sinusoidal asymmetric waveforms, a 180° time shift is NOT necessarily identical to vertical inversion, so the composite peak-to-peak voltage depends on wave shape." }
    ];

    let activeChapter = "all";
    let mode = "practice";
    let userAnswers = {};
    let examSubmitted = false;

    const quizContainer = document.getElementById("quizContainer");
    const modeSelect = document.getElementById("modeSelect");
    const gradeExamBtn = document.getElementById("gradeExamBtn");
    const resetBtn = document.getElementById("resetBtn");

    function getFilteredQuestions() {
      if (activeChapter === "all") return QUESTIONS;
      return QUESTIONS.filter(q => String(q.ch) === activeChapter);
    }

    function updateScoreboard() {
      const list = getFilteredQuestions();
      let answered = 0;
      let correct = 0;

      list.forEach((q, idx) => {
        const key = `${q.ch}-${q.num}`;
        if (userAnswers[key] !== undefined) {
          answered++;
          if (userAnswers[key] === q.ans) correct++;
        }
      });

      const pct = list.length ? Math.round((correct / list.length) * 100) : 0;
      document.getElementById("statAnswered").textContent = `${answered} / ${list.length}`;

      if (mode === "exam" && !examSubmitted) {
        document.getElementById("statScore").textContent = "Hidden until submit";
        document.getElementById("statStatus").textContent = "Exam In Progress";
        document.getElementById("statStatus").className = "stat-value badge-warn";
      } else {
        document.getElementById("statScore").textContent = `${correct} (${pct}%)`;
        const statusEl = document.getElementById("statStatus");
        if (answered === 0) {
          statusEl.textContent = "In Progress";
          statusEl.className = "stat-value badge-warn";
        } else if (pct >= 90) {
          statusEl.textContent = "Passed (≥ 90%)";
          statusEl.className = "stat-value badge-pass";
        } else {
          statusEl.textContent = "Below 90% Target";
          statusEl.className = "stat-value badge-warn";
        }
      }
    }

    function renderQuiz() {
      const list = getFilteredQuestions();
      quizContainer.innerHTML = "";
      const letters = ["(a)", "(b)", "(c)", "(d)"];

      list.forEach(item => {
        const key = `${item.ch}-${item.num}`;
        const chosen = userAnswers[key];
        const showFeedback = (mode === "practice" && chosen !== undefined) || (mode === "exam" && examSubmitted);

        const card = document.createElement("div");
        card.className = "question-card";

        let figHtml = "";
        if (item.fig && FIGURES[item.fig]) {
          figHtml = `
            <div class="figure-box">
              ${FIGURES[item.fig].svg}
              <div class="figure-caption">${FIGURES[item.fig].caption}</div>
            </div>
          `;
        }

        const optionsHtml = item.options.map((opt, idx) => {
          let cls = "option-btn";
          if (showFeedback) {
            if (idx === item.ans) cls += " correct";
            else if (idx === chosen && chosen !== item.ans) cls += " incorrect";
          } else if (chosen === idx) {
            cls += " selected";
          }
          const disabled = (mode === "practice" && chosen !== undefined) || (mode === "exam" && examSubmitted) ? "disabled" : "";
          return `
            <button class="${cls}" data-key="${key}" data-idx="${idx}" ${disabled}>
              <span class="option-letter">${letters[idx]}</span>
              <span>${opt}</span>
            </button>
          `;
        }).join("");

        card.innerHTML = `
          <div class="q-header">
            <span>Chapter ${item.ch} &bull; Question ${item.num}</span>
            <span>${showFeedback ? (chosen === item.ans ? "✓ Correct" : "✗ Review") : ""}</span>
          </div>
          <div class="q-text">${item.q}</div>
          ${figHtml}
          <div class="options">${optionsHtml}</div>
          <div class="explanation ${showFeedback ? "visible" : ""}">
            <strong>Explanation:</strong> ${item.exp}
          </div>
        `;
        quizContainer.appendChild(card);
      });

      document.querySelectorAll(".option-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-key");
          const idx = Number(btn.getAttribute("data-idx"));
          userAnswers[key] = idx;
          renderQuiz();
          updateScoreboard();
        });
      });

      updateScoreboard();
    }

    document.querySelectorAll(".tab-btn").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeChapter = tab.getAttribute("data-ch");
        renderQuiz();
      });
    });

    modeSelect.addEventListener("change", () => {
      mode = modeSelect.value;
      examSubmitted = false;
      gradeExamBtn.style.display = mode === "exam" ? "inline-block" : "none";
      renderQuiz();
    });

    gradeExamBtn.addEventListener("click", () => {
      examSubmitted = true;
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    resetBtn.addEventListener("click", () => {
      userAnswers = {};
      examSubmitted = false;
      renderQuiz();
    });

    renderQuiz();
  </script>
</body>
</html>
